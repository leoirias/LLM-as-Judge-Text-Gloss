# Etapa 2 parte 2 — fusão de candidatas duplicadas por categoria.
# Roda pro grupo voice2sign (default) ou sign2voice (--group sign2voice) —
# io é sempre output/<group>_candidatas.csv -> output/<group>_final.csv.
#
# Mesmo modelo da extração (Qwen3.8-27B, denso, thinking desligado,
# determinístico). max_new_tokens mais alto que a extração porque a lista
# consolidada cresce a cada rodada (carrega o estado inteiro pra frente).

model:
  name: qwen3.8-27b
  model_id: Qwen/Qwen3.8-27B
  dtype: bfloat16
  device_map: cuda

generation:
  enable_thinking: false      # thinking desligado de propósito (ver llm.py)
  max_new_tokens: 8000
  do_sample: false
  temperature: 0.0
  top_p: 1.0

id_prefix: ASLFD
lote_tamanho: 15   # candidatas novas por rodada de fusão
