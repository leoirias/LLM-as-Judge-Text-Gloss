# Extração (etapa 1): texto de um trecho do livro -> regras candidatas em
# JSON. `id` NÃO é pedido aqui (extract.py atribui depois, por categoria);
# o modelo só escolhe `categoria` de uma lista fechada.
#
# Thinking DESLIGADO (ver config.yaml) — resposta direta, sem <think>.

objective: |
  Você está extraindo regras e convenções de American Sign Language (ASL) a
  partir de um trecho de um livro de referência. O objetivo é capturar tudo
  que ajude a produzir uma glosa de ASL mais CORRETA e mais FLUIDA/NATURAL —
  isso inclui regras estruturais (ordem dos sinais, morfologia, pronomes,
  verbos, perguntas, negação, tempo/aspecto, tópico-comentário) E TAMBÉM
  expressões idiomáticas e convenções fixas de uso que tornam a comunicação
  mais natural, mesmo quando não são regras sintáticas estritas.

escopo: |
  INCLUA:
  - Regras de nível de FRASE ou de PALAVRA sobre gramática/estrutura.
  - Expressões idiomáticas (ex.: um capítulo sobre expressões populares) —
    para cada uma, descreva QUANDO/COMO se usa e O QUE significa;
    categoria = "expressoes-idiomaticas".
  - Convenções de uso que aparecem em capítulos de vocabulário temático
    (casa, direções, compras, trabalho, lazer, saúde) SE houver um padrão
    reaproveitável (ex.: como comparativos/superlativos se formam, como
    números se incorporam a um sinal, como referentes são rastreados no
    espaço) — não extraia um item de vocabulário isolado sem padrão.
  IGNORE: listas de vocabulário sem padrão nenhum por trás (um sinal = uma
  palavra, sem regra), instruções de datilologia (soletração manual), notas
  de história/cultura Surda, e dicas de aprendizado ("como praticar").

schema: |
  Retorne um objeto JSON: {"rules": [regra, regra, ...]}. Cada regra tem
  EXATAMENTE estes campos (NÃO inclua um campo "id" — isso é atribuído depois):
    categoria             - EXATAMENTE uma destas:
                            morfologia | pronomes | verbos | concordancia |
                            sintaxe | negacao | tempo-aspecto | pergunta |
                            foco | classificadores | expressoes-idiomaticas
    titulo                - nome curto da regra
    descricao             - O QUE a regra determina (o resultado na glosa/estrutura),
                            ou o que a expressão idiomática significa
    gatilho                - QUANDO a regra se aplica: a condição na frase/contexto
                            que a ativa (ex.: "frase no futuro com 'will'"), ou
                            em que situação usar a expressão idiomática
    verificavel_por_texto - true se dá para checar só olhando o TEXTO da glosa;
                            false se depende de canal fora do texto (expressão
                            facial/não-manual, uso do espaço, orientação/movimento
                            da mão)
    exemplos              - lista de exemplos ilustrativos (texto -> glosa quando houver)
    fonte_pagina          - o número exatamente como aparece nos marcadores [p.N]
                            do texto abaixo
    fonte_citacao         - citação verbatim curta (<=200 chars) do texto que
                            sustenta a regra, copiada (não parafraseada)

instrucoes: |
  - Uma regra por fenômeno/expressão distinto. Não repita a mesma regra com
    palavras diferentes.
  - Se o texto enuncia a regra junto de uma exceção, descreva a exceção dentro
    da `descricao` em vez de criar uma segunda regra.
  - NÃO invente regra que o texto não afirma. Se algo é só sugerido ou ambíguo,
    não extraia.
  - `fonte_citacao` deve ser copiada do texto, não parafraseada.
  - Escreva `descricao`, `gatilho` e `titulo` em português; mantenha os SINAIS/
    glosas em maiúsculas como no original (ex.: PRO.1, GO-TO-BED).
  - NÃO use aspas duplas (") dentro dos valores de texto (descricao, gatilho,
    exemplos, fonte_citacao) — aspas duplas cruas ali quebram o JSON. Se
    precisar destacar uma palavra/expressão, use aspas simples ('assim').

output_rules: |
  Produza APENAS o objeto JSON descrito. Sem cercas de markdown, sem comentário
  antes ou depois, nada após a chave final.

template: |
  @{objective}

  @{escopo}

  @{schema}

  @{instrucoes}

  @{output_rules}

  Texto do trecho (páginas marcadas inline como [p.N]):
  {{chapter_text}}

  JSON:
