# Config do juiz guiado por regras (framework_rules). Autocontida.
#
# Thinking LIGADO + temperatura 0.5 (do_sample ligado): a validação exige
# raciocínio para casar a glosa contra ~15 regras, escolher quais citar e
# propor correção. O bloco <think> é removido no parse.

model:
  name: qwen3-32b
  model_id: Qwen/Qwen3-32B
  dtype: bfloat16
  device_map: cuda            # GPU única do container (docker-compose) -> cuda:0

generation:
  enable_thinking: true       # juiz raciocina antes de emitir o JSON
  max_new_tokens: 2048        # espaço para thinking + JSON final
  do_sample: true             # temperatura 0.5 exige amostragem
  temperature: 0.5
  top_p: 0.9

batch_size: 4                 # 32B + KV cache com thinking longo em 1 A100

io:
  input: data/pares_review.csv
  # colunas do CSV de entrada
  text_col: Input
  gloss_col: Output
  review_col: Output review
  # saídas dos experimentos ficam organizadas em framework_rules/experiments/
  experiments_dir: framework_rules/experiments
