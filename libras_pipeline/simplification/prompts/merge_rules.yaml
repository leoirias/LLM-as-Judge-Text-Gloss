# Fusão de candidatas duplicadas dentro de UMA categoria, em rodadas
# (consolidado até agora + lote novo -> consolidado atualizado).
# Thinking DESLIGADO (ver config.yaml).

objective: |
  Você está organizando candidatas a regra gramatical da Língua Brasileira
  de Sinais (Libras), extraídas de livros acadêmicos de linguística, todas
  da MESMA categoria linguística ("{{categoria}}"), pra chegar numa lista
  final SEM DUPLICATAS. Duas candidatas devem virar UMA regra final quando
  descrevem o MESMO fenômeno gramatical — mesmo vindas de páginas/livros
  diferentes, com exemplos diferentes, ou escritas com palavras diferentes.

estado: |
  Lista CONSOLIDADA até agora (resultado das rodadas anteriores; pode estar
  vazia se esta é a primeira rodada — nesse caso, cada nova candidata abaixo
  vira uma entrada nova, a menos que duas delas sejam claramente o mesmo
  fenômeno entre si):
  {{consolidado}}

novas: |
  NOVAS candidatas a considerar nesta rodada (ainda não avaliadas):
  {{novas}}

instrucoes: |
  - Para cada nova candidata: decida se ela é o MESMO fenômeno de alguma
    regra já na lista consolidada (funda as duas — a nova candidata NÃO
    vira uma entrada separada, ela se junta à existente) ou se é um
    fenômeno DISTINTO de tudo que já está na lista (vira uma entrada nova).
  - Regras já consolidadas que NENHUMA nova candidata tocar nesta rodada
    devem ser devolvidas EXATAMENTE como estavam (mesmo texto, mesmo
    ids_origem) — não reescreva o que não mudou.
  - Ao fundir, escreva uma `descricao` clara que cubra os casos de todas as
    candidatas fundidas, e combine os `exemplos` das duas sem repetir.
  - `ids_origem` acumula TODOS os IDs de candidatas já fundidas naquela
    regra, incluindo fusões de rodadas anteriores — nunca remova um ID que
    já estava lá.
  - `justificativa_fusao`: frase curta explicando por que as candidatas são
    o mesmo fenômeno. Deixe "" se a regra ainda tem só 1 id_origem.
  - NÃO invente regra que nenhuma candidata sustente. NÃO funda duas
    candidatas só porque são da mesma categoria — categoria ampla (ex.
    "sintaxe") cobre vários fenômenos distintos; só funda se for
    literalmente a mesma regra.
  - NÃO use aspas duplas (") dentro dos valores de texto — use aspas
    simples ('assim') se precisar destacar uma palavra/sinal.

schema: |
  Retorne APENAS um objeto JSON: {"regras_finais": [regra, regra, ...]},
  com a lista COMPLETA e atualizada (consolidado anterior + o que mudou
  nesta rodada). Cada regra tem EXATAMENTE estes campos:
    titulo               - nome curto da regra final
    descricao            - o que a regra determina, cobrindo todas as
                            candidatas fundidas nela
    gatilho               - quando a regra se aplica
    exemplos              - lista de exemplos (combinados, sem repetir)
    ids_origem            - lista dos IDs das candidatas (ex.:
                            "ASLFD.SINTAXE.003") fundidas nesta regra
    justificativa_fusao  - por que foram fundidas; "" se só 1 id_origem

output_rules: |
  Produza APENAS o objeto JSON descrito. Sem cercas de markdown, sem
  comentário antes ou depois, nada após a chave final.

template: |
  @{objective}

  Categoria: {{categoria}}

  @{estado}

  @{novas}

  @{instrucoes}

  @{schema}

  @{output_rules}

  JSON:
