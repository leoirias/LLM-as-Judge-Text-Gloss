services:
  judge:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-as-judge-text-gloss:latest
    container_name: llm-as-judge-text-gloss
    working_dir: /workspace
    env_file:
      - .env
    environment:
      HF_HOME: /workspace/.cache/huggingface
      HF_HUB_DISABLE_XET: "1"
      # Cluster has flaky outbound DNS for huggingface.co / pypi.org.
      # Model weights are already cached on /raid; force offline mode so
      # transformers / HF Hub do not try to phone home at load time.
      # Disable these temporarily if you need to pull a new model.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      UV_PROJECT_ENVIRONMENT: /opt/venv
    # Cluster Docker (20.10.8) has an old seccomp profile that blocks clone3,
    # which the bookworm-based uv image's glibc needs to spawn threads.
    security_opt:
      - seccomp:unconfined
    # vLLM uses shared memory for inter-process tensor passing; default 64 MB
    # is not enough and causes silent hangs.
    shm_size: "8gb"
    ipc: host
    volumes:
      - .:/workspace
      - /raid/dom/libras/.cache/huggingface:/workspace/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            # Expõe TODAS as GPUs ao container. Qual usar é decidido NA HORA DE
            # RODAR, com CUDA_VISIBLE_DEVICES=N no comando (N = GPU livre do
            # momento) — assim não precisa editar este arquivo nem recriar o
            # container quando a ocupação muda. Continua sendo 1 GPU por run.
            - driver: nvidia
              count: all
              capabilities: [gpu]
    tty: true
    stdin_open: true
    command: ["bash"]
