[project]
name = "llm-as-judge-text-gloss"
version = "0.1.0"
description = "LLM-as-a-Judge experiments for English text to ASL gloss pairs."
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.8.0",
    "openai>=1.0.0",
    "pydantic>=2.11.0",
    "pyyaml>=6.0.0",
    # 2.9.x especificamente: foi a versão verificada nesta máquina (carregou um
    # Qwen3 na A100 e gerou em bf16 sob o driver 535). 2.11+cu128 provavelmente
    # também funciona, mas não foi testado aqui — subir só com teste.
    "torch>=2.9.1,<2.10",
    "tqdm>=4.67.0",
    "transformers>=5.15.0,<6",
    # normalization pipeline (B2 deterministic stages)
    "ftfy>=6.2.0",
    "rapidfuzz>=3.9.0",
    "spacy>=3.8.0,<3.9",
    "click>=8.1.0",  # spacy.__init__ imports its CLI which requires click
    "pyspellchecker>=0.8.0",
    "en-core-web-sm",
    "pypdf>=6.14.2",
]

[tool.uv.sources.en-core-web-sm]
url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]

[tool.uv]
package = false

# Cluster's NVIDIA driver is 535, which caps at CUDA 12.2 — but CUDA minor
# version compatibility means ANY cu12x wheel runs on it. What actually breaks
# is CUDA 13.x (default PyPI torch ships +cu130 and crashes at
# torch._C._cuda_init()). Verified on the cluster's A100: torch 2.9.1+cu128
# initialises CUDA and runs bf16 matmul fine under driver 535.
#
# cu128 (not cu121) because transformers 5.x is required for the 2026 model
# architectures (qwen3_5 family) and pairs with a current torch.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
