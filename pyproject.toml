[project]
name = "llm-as-judge-text-gloss"
version = "0.1.0"
description = "LLM-as-a-Judge experiments for English text to ASL gloss pairs."
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.8.0",
    "openai>=1.0.0",
    "pydantic>=2.11.0",
    "pyyaml>=6.0.0",
    "torch>=2.5.0,<2.6",
    "tqdm>=4.67.0",
    "transformers>=4.52.0,<5",
    # normalization pipeline (B2 deterministic stages)
    "ftfy>=6.2.0",
    "rapidfuzz>=3.9.0",
    "spacy>=3.8.0,<3.9",
    "click>=8.1.0",  # spacy.__init__ imports its CLI which requires click
    "pyspellchecker>=0.8.0",
    "en-core-web-sm",
]

[tool.uv.sources.en-core-web-sm]
url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]

[tool.uv]
package = false

# Cluster's NVIDIA driver is 535 (CUDA 12.2 max). Default PyPI torch ships
# +cu130 which crashes at torch._C._cuda_init(). Pull torch from PyTorch's
# cu121 wheel index instead.
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu121" }]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
