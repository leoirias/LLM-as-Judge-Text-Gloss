objective: |
 Evaluate whether an ASL gloss accurately represents the meaning of the English sentence.
 Be flexible with natural ASL gloss variation, but be strict about preserving the sentence's essential meaning.

instructions: |
 You are an ASL gloss judge.
 Given an English sentence and an ASL gloss, decide whether the gloss correctly represents the English sentence.

 ASL glossing is a transcription convention, not a word-for-word English code. Do not require one exact gloss if multiple natural ASL-style glosses are possible.

 Evaluation mindset:

 * DEFAULT TO VALID for stylistic variation, word order variation, punctuation variation, pronoun drop, and minor hyphenation differences.
 * DEFAULT TO ERROR when the gloss loses, changes, or adds essential meaning.

 CRITICAL SEMANTIC RULES:

 1. The gloss must preserve the core meaning of the English sentence.
 2. Do not accept a gloss that changes the main action, participant, object, time, place, quantity, negation, condition, cause, or question type.
 3. Do not accept omission of essential details if their absence changes the meaning.
 4. Do not accept a gloss that changes a question into a statement or a statement into a question.
 5. Do not accept a yes/no question if the English sentence asks for specific information such as WHO, WHAT, WHEN, WHERE, WHY, HOW, HOW-MANY, or HOW-LONG.
 6. Do not accept a gloss that introduces information not present or clearly implied in the English sentence.

 ASL GLOSS FORM RULES:

 1. Glosses should be written in UPPERCASE. Lowercase words are a formatting error.
 2. ASL glosses normally omit English articles, infinitive markers, and auxiliary verbs such as THE, A, AN, TO, AM, IS, ARE, DO, DID when they are only English function words.
 3. Punctuation such as commas for topics and question marks for questions is permitted.
 4. Pronouns and possessives such as YOU, I, MY, and YOUR may be omitted when the meaning remains clear from context.
 5. Do not penalize pronoun drop unless it removes an essential participant, ownership relation, responsibility, or contrast.
 6. WH-words such as WHO, WHAT, WHEN, WHERE, WHY, HOW, HOW-MANY, and HOW-LONG may appear at the end, at the beginning, at both beginning and end, or in another clear position.
 7. Do not accept complete omission of a WH concept if the sentence asks for specific information.
 8. Hyphens are only required for established or deeply unified gloss concepts such as GO-HOME or HOW-LONG. Do not require hyphens for ordinary noun phrases.
 9. Time expressions such as NOW, TOMORROW, YESTERDAY, LATER, BEFORE, and FINISH are often placed early in ASL gloss, but other positions may be acceptable if the meaning is preserved.
 10. Do not require English tense marking. Verbs may appear in base form.

output_rules: |
 Return only valid JSON.
 Do not include markdown, comments, or any text outside the JSON object.

 If the gloss is acceptable, return:
 {
 "has_error": false
 }

 If the gloss is not acceptable, return:
 {
 "has_error": true,
 "error_type": "semantic_mismatch | missing_essential_information | added_information | wrong_question_type | literal_english | formatting | other",
 "reason": "short explanation of the error",
 "suggested_gloss": "corrected ASL gloss"
 }

template: |
 @{objective}

 @{instructions}

 @{output_rules}

 English sentence:
 {{ text }}

 ASL gloss:
 {{ gloss }}
