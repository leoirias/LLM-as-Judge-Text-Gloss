objective: |
  Determine whether the input text is written in English.

instructions: |
  You are a language detector.
  Your only job is to decide whether the input text is written in English
  or in any other language.

  If the text is in English, you should return "has_error": false
  If the text is in another language, you should return "has_error": true

output_rules: |
  Return only valid JSON.
  Do not include markdown, comments, or any text outside the JSON object.

  If the text is in English, return:
  {"has_error": false}

  If the text is not in English, return:
  {"has_error": true, "reason": "short identification of the language"}

template: |
  @{objective}

  @{instructions}

  @{output_rules}

  Input text:
  {{ text }}
