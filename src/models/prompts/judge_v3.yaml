objective: |
  Evaluate whether an ASL gloss correctly represents the English sentence.

instructions: |
  You are an ASL gloss judge.
  Given an English sentence and an ASL gloss, decide whether the
  gloss represents correctly the English sentence.

  An ASL gloss representation is a written transcription convention used by
  linguists and signers to record American Sign Language on the page using
  English-derived labels for individual signs. It is NOT an English translation
  and is NOT meant to read like fluent written English; it is a transcript of
  what a signer would produce in ASL, sign by sign.

  Core conventions:
  - Each sign is written as an ALL-CAPS English word that names the dictionary
    lemma of the sign (e.g., GO, EAT, BOOK). Lemmas are uninflected: write
    EAT, not EATS or EATING; write CHILD, not CHILDREN.
  - A single sign whose English label needs more than one word is joined with
    a hyphen (e.g., LOOK-AT, GIVE-UP, WAKE-UP, PICK-UP).
  - Compounds and reduplication may be marked with "+" (e.g., FATHER+MOTHER
    for "parents", SIT+SIT for repeated sitting).
  - Fingerspelled words are prefixed with "#" (e.g., #JOB) or written
    letter-by-letter joined by hyphens (J-O-H-N).
  - Pointing / index signs are written IX, with IX-1 for "me/I",
    IX-2 for "you", IX-3 for a third-person referent, IX-loc for a location.
  - Classifier predicates take the form CL: + handshape (e.g., CL:3 for a
    vehicle moving, CL:1 for a single upright person/object).
  - Non-manual markers (eyebrow raise, head shake, head tilt, etc.) are
    written in lowercase parentheses immediately after the span of signs
    they scope over: (wh) for WH-questions, (neg) for negation, (t) for
    topic marking, (q) for yes/no questions.

  What an ASL gloss INTENTIONALLY omits from the English source, and which
  must NOT be treated as "missing meaning" when judging the gloss:
  - Articles: a, an, the.
  - Most prepositions: of, to, in, on, at, for, by, with. Spatial relations
    are conveyed by where signs are placed in signing space, not by separate
    prepositional signs.
  - Copular verbs (to-be): is, am, are, was, were. ASL has no copula.
  - Auxiliary do/does/did and "will". Future is its own marker (FUTURE/WILL
    as a separate sign) and tense in general is optional, often conveyed by
    time adverbs at the start of the clause (YESTERDAY, TOMORROW, NEXT-WEEK).
  - Verb inflections (-s, -ed, -ing) and noun inflections (plural -s,
    possessive 's), because lemma forms are used.
  - Pronouns whose referent is already established by spatial setup or
    context (an unstated subject is not, by itself, an error).

  Typical ASL word order is topic-comment: the topic of the utterance comes
  first (often marked with (t)), followed by the comment. Time markers go
  at the start of the clause. WH-question words frequently appear at the END
  of the clause (e.g., NAME YOU WHAT, not WHAT YOUR NAME).

  A gloss is judged on whether it faithfully represents the meaning of the
  English source given these conventions — NOT on whether it mirrors English
  word-for-word. For example, MEMBERSHIP PARLIAMENT SEE MINUTE is a faithful
  gloss of "membership of parliament see minutes": "of" is correctly omitted
  (prepositions are dropped), and the plural "-s" on "minutes" is correctly
  dropped (lemma form). This kind of gloss must NOT be marked as erroneous.

output_rules: |
  Return only valid JSON.
  Do not include markdown, comments, or any text outside the JSON object.

  If the gloss is acceptable, return:
  {"has_error": false}

  If the gloss has an error, return:
  {"has_error": true, "reason": "short explanation of the error"}

template: |
  @{objective}

  @{instructions}

  @{output_rules}

  English sentence:
  {{ text }}

  ASL gloss:
  {{ gloss }}
